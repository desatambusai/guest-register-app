<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Register Tamu Desa Tambusai</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="logo-tambusai.png">
</head>
<body>

    <header>
        <img src="logo-tambusai.png" alt="Logo Desa Tambusai" class="header-logo">
        <h1>Pemerintah Desa Tambusai 🇮🇩</h1>
    </header>

    <div class="container">
        <div class="card">
            <h2>Formulir Kunjungan</h2>
            <p class="subtitle">Silakan isi data diri Anda untuk keperluan administrasi desa.</p>
            
            <form id="guestForm">
                <label for="nama">Nama Lengkap *</label>
                <input type="text" id="nama" name="Nama" placeholder="Contoh: Budi Santoso" required>

                <label for="instansi">Asal Instansi / Alamat *</label>
                <input type="text" id="instansi" name="Asal Instansi" placeholder="Contoh: PT. Maju Jaya / Dusun II" required>

                <label for="hpwa">Nomor HP/WhatsApp *</label>
                <input type="tel" id="hpwa" name="Nomor HP/WA" placeholder="0812..." required pattern="[0-9]{8,15}">

                <div class="date-time-group">
                    <div>
                        <label for="tanggal">Tanggal Kunjungan *</label>
                        <input type="date" id="tanggal" name="Tanggal Kunjungan" required>
                    </div>
                    <div>
                        <label for="waktu">Waktu Kunjungan *</label>
                        <input type="time" id="waktu" name="Waktu Kunjungan" required>
                    </div>
                </div>

                <label for="tujuan">Tujuan Kunjungan *</label>
                <textarea id="tujuan" name="Tujuan" placeholder="Menjelaskan keperluan kunjungan..." required rows="3"></textarea>

                <div class="camera-section">
                    <label>Ambil Foto Selfie (Bukti Kehadiran) *</label>
                    <video id="video" autoplay playsinline style="width: 100%; border-radius: 8px; display: none;"></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                    <img id="photoPreview" src="" alt="Pratinjau Foto" style="display:none; width: 100%; border-radius: 8px; margin-top: 10px;">
                    
                    <div class="camera-buttons">
                        <button type="button" id="btnStart" onclick="startCamera()" class="btn-secondary">Aktifkan Kamera</button>
                        <button type="button" id="btnCapture" onclick="takePhoto()" class="btn-secondary">Ambil Foto</button>
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="btn-primary">Kirim Data</button>
            </form>
        </div>
    </div>

    <script>
        // 1. KONFIGURASI: Ganti dengan URL Web App Anda
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwuHmo9Rxr581_12Q-2ylxVRJFrm8jK8U8-AL-mDWoptKY0CIff7iRSyZTfZW0yi_gqXw/exec';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photoPreview = document.getElementById('photoPreview');
        const guestForm = document.getElementById('guestForm');
        let photoBase64 = '';

        // SET TANGGAL & WAKTU OTOMATIS SAAT HALAMAN DIBUKA
        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            document.getElementById('tanggal').value = now.toISOString().split('T')[0];
            document.getElementById('waktu').value = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        });

        // 2. FUNGSI AKSES KAMERA
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                video.srcObject = stream;
                video.style.display = 'block';
                document.getElementById('btnStart').style.display = 'none';
            } catch (err) {
                console.error(err);
                if (location.protocol !== 'https:') {
                    alert("Kamera hanya bisa aktif di HTTPS. Jika di komputer, gunakan Live Server.");
                } else {
                    alert("Akses kamera ditolak atau tidak ditemukan.");
                }
            }
        }

        // 3. FUNGSI AMBIL FOTO + KOMPRESI OTOMATIS (Mencegah Error Submit)
        function takePhoto() {
            if (!video.srcObject) {
                alert("Nyalakan kamera terlebih dahulu!");
                return;
            }
            const context = canvas.getContext('2d');
            
            // Kompresi: Max lebar 800px agar file ringan
            const maxWidth = 800;
            const scale = maxWidth / video.videoWidth;
            canvas.width = maxWidth;
            canvas.height = video.videoHeight * scale;

            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Simpan sebagai JPEG kualitas 0.7 (70%)
            photoBase64 = canvas.toDataURL('image/jpeg', 0.7);
            
            photoPreview.src = photoBase64;
            photoPreview.style.display = 'block';
        }

        // 4. PROSES KIRIM DATA
        guestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!photoBase64) {
                alert("Mohon ambil foto selfie sebagai bukti kunjungan.");
                return;
            }

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Sedang Mengirim...";

            const formData = new FormData(guestForm);
            const data = Object.fromEntries(formData.entries());
            data['Foto Selfie'] = photoBase64;

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Penting untuk Google Apps Script
                    body: JSON.stringify(data)
                });

                // Karena mode 'no-cors', kita tidak bisa membaca respons JSON secara langsung
                // Kita asumsikan sukses jika tidak ada error network
                alert("Terima kasih! Data kunjungan Anda berhasil dikirim.");
                guestForm.reset();
                photoPreview.style.display = 'none';
                photoBase64 = '';
                
            } catch (err) {
                console.error(err);
                alert("Gagal mengirim data. Cek koneksi atau URL Apps Script Anda.");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Kirim Data";
            }
        });
    </script>
</body>
</html>
